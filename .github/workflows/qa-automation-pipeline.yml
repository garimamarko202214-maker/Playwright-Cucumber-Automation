name: QA Automation Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  generate-test-cases:
    name: Agent 1 - QA Test Case Generator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Install Dependencies
        run: npm install

      - name: Verify Test Case JSON
        run: |
          echo "Checking test cases..."
          ls -la test-cases
          cat test-cases/login-test-case.json

      - name: Upload Test Case Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-cases-artifact
          path: test-cases/login-test-case.json
 
  generate-automation-code:
      name: Agent 2 - UI Test Automator
      runs-on: ubuntu-latest
      needs: generate-test-cases

      steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Download Test Case Artifact
        uses: actions/download-artifact@v4
        with:
          name: test-cases-artifact
          path: test-cases

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Cucumber Tests
        run: npm run test

      - name: Generate HTML Report
        if: always()
        run: node generate-report.js

      - name: Upload Cucumber Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: reports/cucumber-report.html